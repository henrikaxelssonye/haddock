name: 'haddock_test_data'
version: '1.0.0'
config-version: 2

profile: 'haddock_test_data'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  haddock_test_data:
    +schema: main

models:
  haddock_test_data:
    +materialized: view
    # Materialize large models as tables for actual data storage
    large_regions:
      +materialized: table
    large_customers:
      +materialized: table
    large_products:
      +materialized: table
    large_sales:
      +materialized: table
    large_sales_summary:
      +materialized: table
    large_customer_totals:
      +materialized: table
    large_product_totals:
      +materialized: table
    monthly_sales_by_region:
      +materialized: table
